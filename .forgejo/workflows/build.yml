name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    # The Windows build runs under Wine, from WineHQ's newest stable release, with the newest stable Windows Python.
    runs-on: ubuntu-latest
    env:
      WINEDEBUG: -all
      WINEPREFIX: /tmp/wine
      # Without these Wine stops at first start to offer its .NET and browser add-ons, which nobody can answer here.
      WINEDLLOVERRIDES: mscoree,mshtml=
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Wine
        run: |
          . /etc/os-release
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          # apt only reads the key in binary form
          wget -qO- https://dl.winehq.org/wine-builds/winehq.key | sudo gpg --dearmor --yes -o /etc/apt/keyrings/winehq-archive.key
          sudo wget -qNP /etc/apt/sources.list.d/ "https://dl.winehq.org/wine-builds/ubuntu/dists/$VERSION_CODENAME/winehq-$VERSION_CODENAME.sources"
          sudo apt-get update -q
          DEBIAN_FRONTEND=noninteractive sudo -E apt-get install -y -q --install-recommends winehq-stable xvfb xauth > /dev/null
          wine --version
          xvfb-run -a sh -c 'wineboot --init && wineserver -w'
      - name: Install Windows Python
        run: |
          # The newest Python with a final 64-bit Windows installer, one per minor version, newest first. A version this
          # Wine can't run yet (3.15's calendar module uses a date format Wine lacks) falls back to the one before.
          for V in $(curl -sSf https://www.python.org/ftp/python/ | grep -o 'href="3\.[0-9]*\.[0-9]*/"' | grep -o '3\.[0-9]*\.[0-9]*' | sort -uV | tac | head -40 \
                     | while read -r v; do curl -sfI "https://www.python.org/ftp/python/$v/python-$v-amd64.exe" > /dev/null && echo "$v"; done \
                     | awk -F. '!seen[$1"."$2]++' | head -3); do
            curl -sSfLo "$RUNNER_TEMP/python.exe" "https://www.python.org/ftp/python/$V/python-$V-amd64.exe"
            xvfb-run -a sh -c "wine '$RUNNER_TEMP/python.exe' /quiet InstallAllUsers=0 PrependPath=0 Include_test=0 Include_launcher=0 && wineserver -w"
            PY=$(find "$WINEPREFIX/drive_c/users" -name python.exe -path "*Python$(echo "$V" | cut -d. -f1-2 | tr -d .)/*" | head -1)
            if [ -n "$PY" ] && wine "$PY" -m pip --version > /dev/null 2>&1; then break; fi
            echo "::warning::Python $V doesn't work under $(wine --version) yet, trying the version before"
            PY=
          done
          [ -n "$PY" ]
          echo "PY=$PY" >> "$GITHUB_ENV"
          wine "$PY" --version
      - name: Test
        run: xvfb-run -a wine "$PY" -m unittest discover -s tests -v
      - name: Build
        run: |
          wine "$PY" -m pip install -q pyinstaller
          wine "$PY" -m PyInstaller --onefile --clean --noconfirm --name Pianola-windows-x64 main.py
      - name: Smoke-test the executable
        run: |
          exe=dist/Pianola-windows-x64.exe
          wine $exe --version
          wine $exe --keys
          wine $exe songs/demo.txt --analyze
          # Opened with no arguments it is the window; it must still be up when timeout ends it, 124 is the pass.
          xvfb-run -a timeout 8 wine $exe || [ $? -eq 124 ]
      - uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: windows
          path: dist/Pianola-windows-x64.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.x"
      - name: Install Tk and its display test tools
        run: |
          sudo apt-get update -q
          DEBIAN_FRONTEND=noninteractive sudo -E apt-get install -y -q --no-install-recommends libtk8.6 xvfb xauth fonts-dejavu-core > /dev/null
      - name: Test
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Build
        run: |
          python -m pip install -q pyinstaller
          # PyInstaller leaves libxcb to the system, for the sake of OpenGL stacks,
          # but minimal installs and some distributions lack it. Tk draws without GL,
          # so carrying it and its own dependencies is safe.
          libs=/usr/lib/x86_64-linux-gnu
          pyinstaller --onefile --clean --noconfirm --name pianola-linux-x86_64 \
            --add-binary "$libs/libxcb.so.1:." --add-binary "$libs/libXau.so.6:." \
            --add-binary "$libs/libXdmcp.so.6:." --add-binary "$libs/libbsd.so.0:." \
            --add-binary "$libs/libmd.so.0:." main.py
      - name: Smoke-test the binary
        run: |
          bin=dist/pianola-linux-x86_64
          pyi-archive_viewer --list --brief $bin | grep -q 'libxcb\.so\.1'
          $bin --version
          $bin --keys
          $bin songs/demo.txt --analyze
          # The window must still be up when timeout ends it; 124 is the pass.
          xvfb-run -a timeout 8 $bin || [ $? -eq 124 ]
      - uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: linux
          path: dist/pianola-linux-x86_64
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Release notes from the tag message
        run: |
          # checkout leaves an annotated tag as a bare ref, so fetch the tag object itself
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          cat notes.md
      - uses: https://code.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum Pianola-windows-x64.exe pianola-linux-x86_64 > SHA256SUMS
      - name: Publish the release
        env:
          # The runner shares the server's network, so this talks to Forgejo directly instead of through the VPS.
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          AUTH: "Authorization: token ${{ secrets.GITHUB_TOKEN }}"
        run: |
          id=$(jq -n --arg tag "$GITHUB_REF_NAME" --rawfile body notes.md '{tag_name: $tag, name: $tag, body: $body}' \
               | curl -sSf -H "$AUTH" -H "Content-Type: application/json" -d @- "$API/releases" | jq .id)
          for f in dist/Pianola-windows-x64.exe dist/pianola-linux-x86_64 dist/SHA256SUMS; do
            curl -sSf -H "$AUTH" -F "attachment=@$f" "$API/releases/$id/assets?name=$(basename "$f")" > /dev/null
          done
