name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build
        run: |
          python -m pip install pyinstaller==6.22.3
          pyinstaller --onefile --clean --noconfirm --name Pianola-windows-x64 main.py
      - name: Smoke-test the executable
        shell: pwsh
        run: |
          $exe = "dist\Pianola-windows-x64.exe"
          & $exe --version
          & $exe --keys
          & $exe songs\demo.txt --analyze
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Opened with no arguments it is the window; it must still be up.
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "the window closed by itself (exit $($p.ExitCode))" }
          Stop-Process -Id $p.Id
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/Pianola-windows-x64.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    # Built against an older glibc so the binary also runs on older distributions.
    container: ubuntu:22.04
    steps:
      - name: Install Python and Tk
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3 python3-venv python3-tk libpython3.10 binutils xvfb xauth fonts-dejavu-core \
            ca-certificates
      - uses: actions/checkout@v7
      - name: Test
        run: xvfb-run -a python3 -m unittest discover -s tests -v
      - name: Build
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install pyinstaller==6.22.3
          # PyInstaller leaves libxcb to the system, for the sake of OpenGL stacks,
          # but minimal installs and some distributions lack it. Tk draws without GL,
          # so carrying it and its own dependencies is safe.
          libs=/usr/lib/x86_64-linux-gnu
          /tmp/venv/bin/pyinstaller --onefile --clean --noconfirm --name pianola-linux-x86_64 \
            --add-binary "$libs/libxcb.so.1:." --add-binary "$libs/libXau.so.6:." \
            --add-binary "$libs/libXdmcp.so.6:." --add-binary "$libs/libbsd.so.0:." \
            --add-binary "$libs/libmd.so.0:." main.py
      - name: Smoke-test the binary
        run: |
          bin=dist/pianola-linux-x86_64
          /tmp/venv/bin/pyi-archive_viewer --list --brief $bin | grep -q 'libxcb\.so\.1'
          $bin --version
          $bin --keys
          $bin songs/demo.txt --analyze
          # The window must still be up when timeout ends it; 124 is the pass.
          xvfb-run -a timeout 8 $bin || [ $? -eq 124 ]
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/pianola-linux-x86_64
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Release notes from the tag message
        run: |
          # checkout leaves an annotated tag as a bare ref, so fetch the tag object itself
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          cat notes.md
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum Pianola-windows-x64.exe pianola-linux-x86_64 > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          files: |
            dist/Pianola-windows-x64.exe
            dist/pianola-linux-x86_64
            dist/SHA256SUMS
          fail_on_unmatched_files: true
